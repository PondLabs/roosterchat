name: _
publish_to: none
environment: 
  sdk: '>=3.6.0 <4.0.0'
workspace:
  - rooster
  - tiamat
  - widgets/matrix_widget_api
  - widgets/calendar
dependencies:
  iso_duration: ^0.1.1

# flutter_angle (the three_js renderer's GL bridge) is vendored in
# third_party/flutter_angle (see third_party/README.md): the Linux plugin
# needed fixing beyond what builds against Flutter 3.41.
dependency_overrides:
  flutter_angle:
    path: third_party/flutter_angle
