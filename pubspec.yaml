name: _
publish_to: none
environment: 
  sdk: '>=3.6.0 <4.0.0'
workspace:
  - rooster
  - tiamat
  - widgets/matrix_widget_api
  - widgets/calendar
dependencies:
  iso_duration: ^0.1.1

# flutter_angle (the three_js renderer's GL bridge) is broken on every
# published version against Flutter 3.41's Linux engine: its texture
# `populate` callback misses the width/height parameters the engine now
# passes, and it writes to an `eglContext` field its own header never
# declares. Upstream has the same bugs on main, so we pin a patched fork
# (branch fix/flutter-3-41-linux on gabriel-s-flores/flutter_angle).
dependency_overrides:
  flutter_angle:
    git:
      url: https://github.com/gabriel-s-flores/flutter_angle.git
      path: flutter_angle
      ref: fix/flutter-3-41-linux
