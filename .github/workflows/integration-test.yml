on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
name: integration-test

# A newer push to the same branch supersedes the run in progress: a pull
# request pushed to twice does not hold two runners for an hour.
concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMESERVER: localhost
  # Local LiveKit for voice e2e (issue #225), started by the Start LiveKit
  # step below and announced to the app through the homeserver's well-known
  # rtc_foci by scripts/integration-prepare-homeserver.sh. Tests that need it
  # skip gracefully when it is unreachable, so runs without Docker still work.
  LIVEKIT_URL: http://localhost:8180
  USER1_NAME: alice
  USER1_PW: AliceInWonderLand
  USER2_NAME: bob
  USER2_PW: CanWeFixIt
  PROJECT_PATH: rooster

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-24.04
    # The tests talk to a real homeserver; without a cap a hung test would sit
    # on the runner for the default six hours.
    timeout-minutes: 60
    steps:
      - name: Checkout  ┏━┓ ︵ /(^.^/)
        uses: actions/checkout@v4
        with:
          submodules: 'true'
        
      - name: Setup Flutter  ╰(✿˙ᗜ˙)੭━☆ﾟ.*･｡ﾟ
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      # cargokit builds librust_lib_rooster with cargo during the Flutter build
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Tools  ᕙ|” ◉ ◡ ◉ ”|ᕗ
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev \
            libkeybinder-3.0-dev libayatana-appindicator3-dev libpulse-dev libasound2-dev clang lld cmake pkg-config

      - name: Start Synapse  [◯ ‸ ◯]
        run: |
          cd $PROJECT_PATH
          scripts/integration-server-synapse.sh

      # Local LiveKit for voice e2e (issue #225); must be up before the
      # homeserver is configured so its focus lands in the well-known.
      - name: Start LiveKit
        run: |
          cd $PROJECT_PATH
          scripts/integration-server-livekit.sh

      - name: Configure Synapse  ╰[ ⁰﹏⁰ ]╯
        run: |
          cd $PROJECT_PATH
          scripts/integration-prepare-homeserver.sh

      - name: Configure Flutter (∩｀-´)⊃━☆ﾟ.*･｡ﾟ
        run: flutter config --enable-linux-desktop
        
      - name: Code Generation __φ(．．;)
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart
          
      - name: Run Unit Tests  ε=ε=┌( >_<)┘
        run: |
          cd $PROJECT_PATH
          scripts/unit-test.sh

      - name: Run Integration Tests  ─=≡Σ((( つ＞＜)つ
        run: |
          cd $PROJECT_PATH
          export DISPLAY=:99
          sudo Xvfb -ac :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          # ffmpeg cannot grab a display that does not exist yet
          for _ in $(seq 1 30); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 1; done
          ffmpeg -f x11grab -video_size 1920x1080 -framerate 15 -i :99 -vcodec libx264 -preset ultrafast -qp 0 -nostdin -loglevel quiet -pix_fmt yuv444p video.mkv &
          FFMPEG_PID=$!
          # The step runs under `bash -e`, so the failure has to be caught here
          # or the recording is never finalised and the artifact is unusable.
          set +e
          scripts/integration-test.sh
          INTEGRATION_TEST_EXIT_CODE=$?
          set -e
          kill -INT $FFMPEG_PID 2>/dev/null || true
          wait $FFMPEG_PID 2>/dev/null || true
          exit $INTEGRATION_TEST_EXIT_CODE

      - name: Upload Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: result.mkv
          path: rooster/video.mkv
