name: voice-dsp-native

# Noise suppression inside the real WebRTC on Linux: a PulseAudio microphone
# plays a noisy recording into the app's microphone test and WebRTC's own
# statistics say what got encoded (tools/voice_dsp/native_noise_loop.sh).
# ci.yml's publish waits for it: v1.7.2, v1.8.0 and v1.10.1 went out with
# this loop red while it ran on its own. See docs/voice-audio-processing.md,
# "What the tests guard".
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Noise suppression inside WebRTC
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev \
            libkeybinder-3.0-dev libayatana-appindicator3-dev libpulse-dev libasound2-dev clang lld \
            cmake pkg-config xvfb pulseaudio pulseaudio-utils
      - name: Code generation
        working-directory: rooster
        run: dart run scripts/codegen.dart
      - name: Noise suppression inside WebRTC
        run: |
          pulseaudio --start --exit-idle-time=-1
          xvfb-run -a -s '-screen 0 1920x1080x24' tools/voice_dsp/native_noise_loop.sh
