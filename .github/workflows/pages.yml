# The landing page, at https://pondlabs.github.io/roosterchat/.
name: pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/brand/logo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          cp website/* _site/
          cp docs/brand/logo/mark.svg docs/brand/logo/app-icon.svg docs/brand/logo/app-icon-1024.png _site/
          cp rooster/assets/font/sora/Sora-VariableFont_wght.ttf _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
