<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740"><defs><style>text{font-family:Inter,Arial,sans-serif}.muted{fill:#9b9da6}.white{fill:#f1f2f5}.tiny{font-size:12px}.small{font-size:14px}.bold{font-weight:700}.card{fill:#212329;stroke:#393b43}.popup{fill:#25272e;stroke:#41434c}.row{fill:#424650}.line{stroke:#41434c}</style></defs><rect width="1500" height="740" fill="#17181c"/><text x="56" y="58" fill="#a4a7b0" font-size="13" font-weight="700" letter-spacing="2">ROOSTER CHAT · EXPLORAÇÃO DE UI</text><text x="56" y="98" class="white" font-size="30" font-weight="700">Três direções para mencionar alguém</text><text x="56" y="126" class="muted" font-size="15">Todas incluem estado de seleção; a navegação por ↑ ↓ e Enter fica visível nas opções 2 e 3.</text>
