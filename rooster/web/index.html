<!DOCTYPE html>
<html>

<head>
  <!--

  <meta charset="UTF-8">

  <meta name="description" content="Talk. Play. Hang out.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rooster">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <title>Rooster</title>

  <!-- Voice DSP glue (noise suppression / input gate), needed at call time.
       See docs/voice-audio-processing.md -->

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">


















  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #1B1613;
      background-size: 100% 100%;
    }

    @media (prefers-color-scheme: light) {
      body {
        background-color: #E4D7C6;
      }
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      max-width: 200px;
    }

    /* The loading screen: the rooster whistling along to its headphones (frames drawn
       by docs/brand/src/build_loading.py), the comb dots taking turns and a
       changing caption. Keep in step with lib/ui/pages/loading/loading_page.dart. */
    @font-face {
      font-family: "Sora";
      src: url("assets/assets/font/sora/Sora-VariableFont_wght.ttf");
      font-weight: 100 900;
      font-display: swap;
    }

    #splash {
      --accent: #E8382A;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @media (prefers-color-scheme: light) {
      #splash {
        --accent: #C9452B;
      }
    }

    #splash > * {
      animation: splash-in 250ms ease-out backwards;
    }

    #splash img {
      display: block;
      width: 220px;
      height: 220px;
    }

    .splash-dots {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .splash-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.45;
      animation: splash-dot 0.8s ease-in-out infinite;
    }

    .splash-dots span:nth-child(2) {
      animation-delay: 0.12s;
    }

    .splash-dots span:nth-child(3) {
      animation-delay: 0.24s;
    }

    .splash-caption {
      margin: 16px 0 0;
      min-height: 1.4em;
      font: 500 15px/1.4 "Sora", system-ui, sans-serif;
      color: #8D8178;
      white-space: nowrap;
      transition: opacity 250ms ease-in-out;
    }

    @keyframes splash-in {
      from { opacity: 0; transform: scale(0.92); }
    }

    @keyframes splash-dot {
      0%, 50%, 100% { opacity: 0.45; transform: translateY(0) scale(1); }
      25% { opacity: 1; transform: translateY(-4px) scale(1.35); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash > * {
        animation: none !important;
      }

      .splash-caption {
        transition: none;
      }
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
  </script>
</head>

<body>
  <div id="splash">
    <!-- The still first (73 KB), the animation once it has arrived
         (1.5 MB): it used to be the first thing the page fetched. -->
    <img id="splash-image" src="splash/img/dark-2x.png" alt="" aria-hidden="true">
    <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="splash-caption" id="splash-caption" role="status">Waking up the flock&hellip;</p>
  </div>
  <script>
    (function () {
      var lines = ["Waking up the flock…", "Tuning the headphones…",
        "Warming up the mics…", "Pull up a chair."];
      var caption = document.getElementById("splash-caption");
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var animation = new Image();
      animation.onload = function () {
        var still = document.getElementById("splash-image");
        if (still) still.src = animation.src;
      };
      animation.src = "assets/assets/images/loading/rooster_vibing.webp";
      var i = 0;
      var timer = setInterval(function () {
        if (!caption.isConnected) return clearInterval(timer);
        caption.style.opacity = 0;
        setTimeout(function () {
          i = (i + 1) % lines.length;
          caption.textContent = lines[i];
          caption.style.opacity = 1;
        }, 250);
      }, 2800);
    })();
  </script>


  <!-- Starts main.dart.js and CanvasKit now, in parallel (web/flutter_bootstrap.js). -->
  <script src="flutter_bootstrap.js" async></script>


</body>

</html>
