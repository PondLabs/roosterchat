<!doctype html>
<!--
  Rooster's demo video, drawn as a function of time. render_demo.py calls
  seek(t) for every frame and screenshots the stage: 1920x1080 here, and
  1080x1920 for the Instagram reel with ?reel. Open it in a browser and it
  plays in real time (without the music).

  Every screen in it is a capture of the real app (website/media/shots,
  taken by docs/brand/screens). To make the room move, pieces are cut out of
  those captures (an avatar, a member row, a message, a button) and moved:
  a patch of the background they sat on covers where they were. Jonas's
  stream is kart.html, the page he really streamed for the captures.
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Sora; src: url("../../../rooster/assets/font/sora/Sora-VariableFont_wght.ttf"); font-weight: 100 800; }
@font-face { font-family: Nunito; src: url("../../../rooster/assets/font/nunito/NunitoSans-VariableFont_YTLC,opsz,wdth,wght.ttf"); font-weight: 200 1000; }
@font-face { font-family: Twemoji; src: url("../../../rooster/assets/font/emoji-font/TwemojiCOLR.otf"); }

:root {
  --comb: #E8382A; --yolk: #F89B17; --cream: #F7EDE1; --stone: #8D8178;
  --moss: #5E8F4E; --dusk: #3F4F6E; --c2: #241D1A; --c3: #362C27;
  --text: #F5EBDD; --muted: #9C8F85; --bg: #171110;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #000; }
#stage { position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: Nunito, sans-serif; }
.lobe { position: absolute; border-radius: 50%; background: #1F1714; }

/* intro */
#intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#intro-mark { width: 300px; height: 300px; }
#intro-word { margin-top: 18px; display: flex; font-family: Sora; font-weight: 800; font-size: 150px; letter-spacing: -5px; line-height: 1; }
#intro-word span, #intro-tag span { display: inline-block; }
#intro-tag { margin-top: 34px; display: flex; gap: 28px; font-family: Sora; font-weight: 600; font-size: 54px; }

/* captions */
.caption {
  position: absolute; left: 0; right: 0; top: 46px; text-align: center; z-index: 10;
  font-family: Sora; font-weight: 700; font-size: 60px; letter-spacing: -1.5px; line-height: 1.12;
}
.caption em { font-style: normal; color: var(--comb); display: inline-block; }
.caption .sub { display: block; margin-top: 12px; font-family: Nunito; font-weight: 600; font-size: 29px; letter-spacing: 0; line-height: 1.3; color: var(--muted); }

/* a screenshot in a window, the camera over it, and the pieces cut from it */
.frame {
  position: absolute; overflow: hidden; border-radius: 20px; background: #1B1613;
  box-shadow: 0 40px 140px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05);
}
.layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.layer > img { display: block; }
.patch, .cut, .fx { position: absolute; }
.cut { background-repeat: no-repeat; }
.spot { position: absolute; border-radius: 16px; border: 4px solid var(--comb); box-shadow: 0 0 0 9999px rgba(12,8,7,.62); opacity: 0; }
.cursor { position: absolute; width: 40px; height: 40px; opacity: 0; transform-origin: 0 0; }
.ring { position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 4px solid var(--cream); opacity: 0; }
.emoji { position: absolute; font-family: "Noto Color Emoji", sans-serif; line-height: 1; text-align: center; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); opacity: 0; }
.stream { position: absolute; overflow: hidden; }
.stream iframe { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; border: 0; transform-origin: 0 0; }

/* the phone: website/media/devices/phone.svg, 1318 x 2717, a 402 x 874 pt screen */
.phone { position: absolute; aspect-ratio: 1318 / 2717; filter: drop-shadow(0 40px 50px rgba(0,0,0,.5)); }
.phone .screen { position: absolute; left: 4.2489%; top: 1.7667%; width: 91.5023%; height: 96.5035%; overflow: hidden; border-radius: 15.4229% / 7.0938%; background: #1F1916; }
.phone .shot { position: absolute; left: 0; top: 7.0938%; width: 804px; height: 1624px; transform-origin: 0 0; }
.phone .shot > img { display: block; }
.phone > img { position: absolute; inset: 0; width: 100%; height: 100%; }

/* the little things */
.card { position: absolute; opacity: 0; }
.card .pic { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05); }
.card .pic .inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.card .pic .inner > img { display: block; }
.card .label { margin-top: 18px; font-family: Sora; font-weight: 700; font-size: 30px; }
.card .label small { display: block; margin-top: 4px; font-family: Nunito; font-weight: 600; font-size: 22px; color: var(--muted); }

/* your server: the landing page's federation picture */
#net { position: absolute; inset: 0; }
.node { position: absolute; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 40px; background: var(--c2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.node img { width: 92px; }
.node .ini { width: 92px; height: 92px; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-family: Sora; font-weight: 800; font-size: 42px; color: #fff; }
.node .dom { font-size: 19px; font-weight: 800; color: var(--muted); }
.node.me { width: 250px; height: 250px; margin: -125px 0 0 -125px; border: 4px solid var(--comb); }
.node.me img { width: 120px; }
.node.me .dom { color: var(--text); font-size: 22px; }
.pkt { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--yolk); box-shadow: 0 0 16px rgba(248,155,23,.8); }
#lock { position: absolute; left: 50%; top: 935px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: var(--c2); border-radius: 18px; padding: 16px 26px; font-size: 26px; font-weight: 800; white-space: nowrap; }

/* outro */
#outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#outro-lock { display: flex; align-items: center; gap: 34px; }
#outro-lock img { width: 210px; }
#outro-word { font-family: Sora; font-weight: 800; font-size: 150px; letter-spacing: -5px; line-height: 1; }
#outro-tag { font-family: Sora; font-weight: 600; font-size: 44px; color: var(--stone); margin-top: 6px; }
#chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 60px; }
.chip { background: var(--c2); border-radius: 14px; padding: 14px 24px; font-size: 26px; font-weight: 800; }
#free { margin-top: 30px; font-size: 28px; font-weight: 700; color: var(--muted); }
#url { margin-top: 14px; font-size: 30px; font-weight: 800; color: var(--comb); }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 100; }

/* the reel: the same film, stood up, with room for Instagram's own buttons */
.reel .caption { top: 250px; padding: 0 60px; font-size: 74px; }
.reel .caption .sub { font-size: 36px; margin-top: 16px; }
.reel #intro-mark { width: 330px; height: 330px; }
.reel #intro-word { font-size: 170px; }
.reel #intro-tag { flex-direction: column; align-items: center; gap: 10px; font-size: 76px; }
.reel #outro-lock { flex-direction: column; gap: 20px; text-align: center; }
.reel #outro-lock img { width: 260px; }
.reel #outro-word { font-size: 170px; }
.reel #outro-tag { font-size: 50px; }
.reel #chips { max-width: 820px; }
.reel .chip { font-size: 32px; }
.reel #free { font-size: 34px; }
.reel #url { font-size: 36px; }
</style>
</head>
<body>
<div id="stage">
  <div class="lobe" id="deco1"></div>
  <div class="lobe" id="deco2"></div>

  <div id="intro">
    <img id="intro-mark" src="../logo/mark.svg">
    <div id="intro-word"></div>
    <div id="intro-tag"><span>Talk.</span><span>Play.</span><span style="color:var(--comb)">Hang out.</span></div>
  </div>

  <div id="scenes"></div>

  <div id="net">
    <svg id="links" style="position:absolute;left:0;top:0" width="1920" height="1080"></svg>
    <div class="node me"><img src="../logo/mark.svg"><div class="dom">your.server</div></div>
    <div class="node"><div class="ini" style="background:var(--dusk)">m</div><div class="dom">matrix.org</div></div>
    <div class="node"><div class="ini" style="background:var(--moss)">L</div><div class="dom">lan-party.chat</div></div>
    <div class="node"><div class="ini" style="background:var(--yolk)">B</div><div class="dom">bookclub.place</div></div>
    <div class="node"><div class="ini" style="background:var(--comb)">C</div><div class="dom">the-coop.social</div></div>
    <div id="pkts"></div>
    <div id="lock"><span style="font-family:Twemoji">🔒</span>End-to-end encrypted</div>
  </div>

  <div id="outro">
    <div id="outro-lock"><img src="../logo/mark.svg" id="outro-mark"><div><div id="outro-word">Rooster</div><div id="outro-tag">Pull up a chair.</div></div></div>
    <div id="chips"><div class="chip">Windows</div><div class="chip">macOS</div><div class="chip">Linux</div><div class="chip">Browser</div></div>
    <div id="free">Free and open source</div>
    <div id="url">pondlabs.github.io/roosterchat</div>
  </div>

  <div id="fade"></div>
  <div id="preload" style="position:absolute;width:0;height:0;overflow:hidden"></div>
</div>

<script>
const REEL = location.search.includes('reel');
const W = REEL ? 1080 : 1920, H = REEL ? 1920 : 1080;
const SHOTS = '../../../website/media/shots/';
// What the landing page doesn't have: screens/capture-video.mjs's captures.
const VIDEO_SHOTS = 'shots/';

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
// 0..1 progress of t through [t0, t0+d], eased.
const p = (t, t0, d, e = E.out) => e(clamp((t - t0) / d));
// In at t0, out at t1, each over d.
const win = (t, t0, t1, d = .4) => p(t, t0, d) * (1 - p(t, t1 - d, d, E.in));
const lerp = (a, b, k) => a + (b - a) * k;
const set = (el, s) => Object.assign(el.style, s);

// The music: 120 bpm, the kick on every beat from GROOVE (music.py's cues).
const BEAT = .5, GROOVE = REEL ? 2.6 : 4;
// 1 on the kick, falling away before the next one.
const kick = t => t < GROOVE ? 0 : Math.exp(-((t - GROOVE) % BEAT) / .09);
// A hop per beat: up between kicks, landing on each one.
const hop = t => t < GROOVE ? 0 : Math.sin(Math.PI * ((t - GROOVE) % BEAT) / BEAT);

// Keyframes [t, ...values], eased between, held outside.
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const [ta, ...A] = keys[i], [tb, ...B] = keys[i + 1];
    if (t <= tb) { const k = E.io(clamp((t - ta) / (tb - ta))); return A.map((v, j) => lerp(v, B[j], k)); }
  }
  return keys[keys.length - 1].slice(1);
}

const el = (tag, cls, parent, html = '') => { const e = document.createElement(tag); e.className = cls; e.innerHTML = html; parent.appendChild(e); return e; };
const box = (e, x, y, w, h) => set(e, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });

// A piece cut out of a capture, at the place it was taken from, over a patch
// of the colour it sat on (null for no patch).
function cut(parent, src, iw, ih, [x, y, w, h], patch, radius = 0) {
  if (patch) set(el('div', 'patch', parent), { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`, background: patch });
  const c = el('div', 'cut', parent);
  box(c, x, y, w, h);
  set(c, { backgroundImage: `url(${src})`, backgroundSize: `${iw}px ${ih}px`, backgroundPosition: `${-x}px ${-y}px`, borderRadius: `${radius}px` });
  return c;
}
// An avatar (with its ring and mute badge): a square around its centre.
const av = (parent, src, iw, ih, [cx, cy], patch, s = 210) => cut(parent, src, iw, ih, [cx - s / 2, cy - s / 2, s, s], patch);

// Jonas's stream: the game he streamed for the captures, playing.
const STREAMS = [];
function stream(parent, [x, y, w, h], patch) {
  if (patch) set(el('div', 'patch', parent), { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`, background: patch });
  const s = el('div', 'stream', parent, '<iframe src="../screens/kart.html#still"></iframe>');
  box(s, x, y, w, h);
  set(s.firstChild, { transform: `scale(${w / 1600}, ${h / 900})` });
  STREAMS.push(s.firstChild);
  return s;
}

// A camera: a clip played in its tile, seeked to each frame's time.
const CLIPS = location.search.includes('work=') ? decodeURIComponent(location.search.split('work=')[1].split('&')[0]) : '/tmp/rooster-demo';
function video(parent, [x, y, w, h], patch, name) {
  if (patch) set(el('div', 'patch', parent), { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`, background: patch });
  const s = el('div', 'stream', parent, `<video src="file://${CLIPS}/${name}" muted preload="auto"></video>`);
  box(s, x, y, w, h);
  set(s.firstChild, { width: '100%', height: '100%', objectFit: 'cover' });
  return s;
}
function seekVideo(v, at) {
  const want = Math.max(0, at) % 11;
  if (Math.abs(v.currentTime - want) < .001) return null;
  return new Promise(r => { v.addEventListener('seeked', r, { once: true }); v.currentTime = want; });
}

// The tile background, the room's members panel, the chat.
const TILE = '#1e1816', PANEL = '#564542', CHAT = '#28201c', GAP = '#141110';

// ------------------------------------------------------------- the shots
// What moves in each capture. build(scene) cuts the pieces; the function it
// returns moves them at time t (u = t - the scene's start). Coordinates are
// the capture's pixels (1920 x 1131, phones 804 x 1624).
const FX = {
  // Everyone drops into the Lounge, one per beat, Maya last.
  'call-lounge': (s, L, src) => {
    const P = [
      ['theo', [614, 962], 809, 1], ['priya', [1026, 627], 762], ['jonas', [1026, 962], 574], ['lou', [614, 290], 668],
      ['kenji', [614, 627], 621, 1], ['bia', [1026, 290], 527], ['maya', [1438, 625], 715, 1],
    ].map(([name, at, row, talks]) => ({ talks, a: av(L, src, 1920, 1131, at, TILE), r: cut(L, src, 1920, 1131, [128, row - 23, 264, 46], PANEL) }));
    return (t, u) => P.forEach((m, i) => {
      const tj = .5 + i * BEAT, k = p(u, tj, .5, E.back);
      const talk = m.talks && u > tj + .5 ? .035 * Math.abs(Math.sin(t * 8 + i)) : 0;
      set(m.a, { opacity: clamp(k * 2), transform: `scale(${.2 + .8 * k + talk})` });
      const r = p(u, tj, .4);
      set(m.r, { opacity: r, transform: `translateX(${(1 - r) * -40}px)` });
    });
  },

  // Jonas goes live: his stream pops into the call.
  'call-share': (s, L, src) => {
    const live = cut(L, src, 1920, 1131, [330, 559, 46, 30], PANEL, 6);
    const btns = cut(L, src, 1920, 1131, [1522, 626, 124, 70], GAP);
    const v = stream(L, [1236, 765, 406, 228], GAP);
    const A = [[1026, 290], [1438, 375], [614, 962]].map(at => av(L, src, 1920, 1131, at, null));
    return (t, u) => {
      const k = p(u, .9, .55, E.back);
      set(v, { opacity: clamp(k * 2), transform: `scale(${.4 + .6 * k})` });
      set(btns, { opacity: p(u, 1.3, .4) });
      const lk = p(u, .9, .45, E.back);
      set(live, { opacity: clamp(lk * 2), transform: `scale(${.3 + .7 * lk})` });
      A.forEach((a, i) => set(a, { transform: `scale(${1 + .035 * Math.abs(Math.sin(t * 8 + i * 2))})` }));
    };
  },

  // Maya hits Rooster, then Bonk: the button gives, and the sound's emoji
  // sits on her avatar while it plays (SoundboardEmojiOverlay).
  'call-soundboard': (s, L, src) => {
    stream(L, [1236, 765, 406, 228], null);
    const maya = av(L, src, 1920, 1131, [1438, 375], TILE);
    const btns = s.press.map(([, x, y, w, h]) => cut(L, src, 1920, 1131, [x, y, w, h], '#29211e', 10));
    const emo = el('div', 'emoji', L);
    return (t, u) => {
      let cur = null;
      s.press.forEach(([tp, , , , , e], i) => {
        const d = t - tp;
        set(btns[i], { transform: `scale(${d >= 0 && d < .3 ? 1 - .08 * Math.sin(Math.PI * d / .3) : 1})`, filter: d >= 0 && d < .6 ? `brightness(${1.5 - d / 1.2})` : 'none' });
        if (d >= 0) cur = [tp, e];
      });
      const talk = cur && t - cur[0] < 1.6;
      set(maya, { transform: `scale(${1 + (talk ? .05 * Math.abs(Math.sin(t * 10)) : 0)})` });
      if (!cur) return set(emo, { opacity: 0 });
      const d = t - cur[0], k = p(d, 0, .35, E.back), out = p(d, 1.6, .25, E.in);
      emo.textContent = cur[1];
      box(emo, 1450, 290, 80, 80);
      set(emo, { fontSize: '64px', opacity: clamp(k * 2) * (1 - out), transform: `scale(${(.4 + .6 * k) * (1 - .4 * out)})` });
    };
  },

  // Priya on the decks: the room bounces to the beat, the record spins,
  // the song plays on and the queue fills.
  'call-dj': (s, L, src) => {
    const A = [[597, 240], [973, 240], [597, 597], [973, 597], [597, 955], [973, 955]].map(at => av(L, src, 1920, 1131, at, TILE, 200));
    const Q = [706, 772].map(y => cut(L, src, 1920, 1131, [1182, y, 440, 66], TILE));
    // the record turning under the sleeve
    const disc = el('div', 'fx', L);
    box(disc, 1292 - 48, 255 - 48, 96, 96);
    set(disc, { borderRadius: '50%', background: 'conic-gradient(from 0deg, transparent 0 30deg, rgba(255,255,255,.16) 50deg, transparent 75deg 200deg, rgba(255,255,255,.12) 225deg, transparent 250deg)' });
    cut(L, src, 1920, 1131, [1199, 208, 94, 94], null, 6);
    // the progress bar, from 0:23 of 3:18
    // (in two pieces, to keep clear of the 0:23 under its left end)
    [[1198, 302, 414, 16], [1234, 299, 30, 28]].forEach(r => { const e = el('div', 'fx', L); box(e, ...r); set(e, { background: '#342c25' }); });
    const rest = el('div', 'fx', L), done = el('div', 'fx', L), knob = el('div', 'fx', L);
    box(rest, 1208, 311, 392, 4); set(rest, { background: '#74332d', borderRadius: '2px' });
    set(done, { left: '1208px', top: '310px', height: '6px', background: '#e63622', borderRadius: '3px' });
    set(knob, { top: '301px', width: '24px', height: '24px', borderRadius: '50%', background: '#e63622' });
    return (t, u) => {
      A.forEach((a, i) => {
        const h = hop(t) * (i % 2 ? 12 : 16) * p(u, .3, .6);
        set(a, { transform: `translateY(${-h}px)` });
      });
      set(disc, { transform: `rotate(${t * 200}deg)` });
      const x = 1208 + (23 + u) / 198 * 392;
      set(done, { width: `${x - 1208}px` });
      set(knob, { left: `${x - 12}px` });
      Q.forEach((q, i) => {
        const k = p(u, 1.2 + i * BEAT, .45, E.back);
        set(q, { opacity: clamp(k * 1.6), transform: `translateX(${(1 - k) * 80}px)` });
      });
    };
  },

  // The evening in #general goes on: the poll, Maya's rematch, Theo calling
  // on her, Lou.
  'laptop': (s, L, src) => {
    const M = [[476, 92], [566, 278], [846, 52], [900, 60], [962, 56]].map(([y, h]) => cut(L, src, 1920, 1131, [408, y, 1236, h], CHAT));
    return (t, u) => M.forEach((m, i) => {
      const k = p(u, .7 + i * .75, .45, E.back);
      set(m, { opacity: clamp(k * 1.5), transform: `translateY(${(1 - k) * 40}px)` });
    });
  },

  // The call panel's noise suppression button, its card open, while Maya's
  // microphone hears someone typing: off, then on (the click at
  // s.press[0]). Frames captured a quarter second apart play in a loop.
  'ns': (s, L, src) => {
    const frames = ['off', 'on'].map(st => [...Array(6).keys()].map(i => VIDEO_SHOTS + `ns-${st}-${String(i).padStart(2, '0')}.webp`));
    const imgs = frames.flat().map(f => {
      const i = el('img', '', L);
      Object.assign(i, { src: f, width: 1920, height: 1131 });
      set(i, { position: 'absolute', left: 0, top: 0, opacity: 0 });
      return i;
    });
    return (t, u) => {
      const st = t >= s.press[0][0] ? 1 : 0;
      const shown = st * 6 + Math.floor(t * 4) % 6;
      imgs.forEach((im, i) => set(im, { opacity: i === shown ? 1 : 0 }));
    };
  },

  // Jonas's stream full screen: it grows out of its tile (s.grow).
  'call-fullscreen': (s, L, src) => {
    stream(L, [0, 26, 1920, 1080], null);
    cut(L, src, 1920, 1131, [10, 1061, 236, 46], null, 10);
    return () => {};
  },

  // Lou turns his camera on, beside Jonas's stream.
  'call-camera': (s, L, src) => {
    stream(L, [411, 850, 406, 227], null);
    const cam = video(L, [1236, 514, 406, 227], GAP, 'kitten.webm');
    const icon = cut(L, src, 1920, 1131, [348, 655, 28, 28], PANEL);
    const A = [[1025, 291], [1025, 626], [1437, 963]].map(at => av(L, src, 1920, 1131, at, null));
    return (t, u) => {
      const k = p(u, .8, .55, E.back);
      set(cam, { opacity: clamp(k * 2), transform: `scale(${.4 + .6 * k})` });
      const ik = p(u, .8, .45, E.back);
      set(icon, { opacity: clamp(ik * 2), transform: `scale(${.3 + .7 * ik})` });
      A.forEach((a, i) => set(a, { transform: `scale(${1 + .035 * Math.abs(Math.sin(t * 8 + i * 2))})` }));
      return seekVideo(cam.firstChild, u - .8);
    };
  },

  'phone-call': (s, L, src) => {
    stream(L, [406, 978, 396, 222], null);
    const A = [];
    return (t, u) => A.forEach((a, i) => set(a, { transform: `scale(${1 + .04 * Math.abs(Math.sin(t * 8 + i * 2))})` }));
  },

  'phone-chat': (s, L, src) => {
    const M = [[1125, 123], [1250, 93], [1345, 88]].map(([y, h]) => cut(L, src, 804, 1624, [0, y, 804, h], '#2a211d'));
    return (t, u) => M.forEach((m, i) => {
      const k = p(u, .9 + i * .8, .45, E.back);
      set(m, { opacity: clamp(k * 1.5), transform: `translateY(${(1 - k) * 50}px)` });
    });
  },
};

// ------------------------------------------------------------- the film
// cam: [t, zoom, focus x, focus y] in shot pixels; zoom 1 shows the whole
// shot. spot: [t0, t1, x, y, w, h], a lit rectangle with the rest dimmed.
// press: [t, x, y, w, h, emoji], a soundboard button clicked at t; music.py
// plays the sound then. same: the scene before is the same screen, so it
// crossfades in place instead of sliding.
const FRAME = REEL ? { x: 40, y: 600, w: 1000, h: 1000 } : { x: 230, y: 196, w: 1460, h: 860 };
// The noise suppression switch, and where Jonas's stream sits in call-share.
const NS_SWITCH = [147, 1014, 52, 52, null], SHARE_TILE = [1236, 765, 406, 228];
const DESKTOP = [
  { shot: 'call-lounge', t0: 3.9, t1: 9.8,
    cap: 'Voice rooms <em>that stay open.</em>', sub: 'Rooms don\'t ring. Drop in, drop out, and see who\'s around before you join.',
    cam: [[3.9, 1.04, 900, 565], [8.6, 1.1, 820, 600]] },
  { shot: 'ns', img: VIDEO_SHOTS + 'ns-off-00.webp', t0: 9.6, t1: 17.6,
    cap: 'Noise suppression, <em>one click away.</em>', sub: 'Sound on: the microphone as it is, then what the room hears.',
    cam: [[9.6, 1, 960, 565], [10.8, 1.3, 520, 840]],
    cursor: [[12.2, 700, 980], [13.4, 176, 1044]], press: [[13.8, ...NS_SWITCH]] },
  { shot: 'call-share', t0: 17.4, t1: 21.8,
    cap: 'Share your screen, <em>with its sound.</em>', sub: 'Stream a game, or put a movie on for everyone.',
    cam: [[17.4, 1, 960, 565], [18.8, 1.3, 1400, 760], [20.2, 1.3, 1400, 760], [20.9, 1, 960, 565]],
    spot: [18.6, 20.5, 1234, 764, 408, 230],
    cursor: [[20.6, 1300, 950], [21.2, 1611, 660]], press: [[21.4, 1587, 636, 48, 48, null]] },
  { shot: 'call-fullscreen', img: VIDEO_SHOTS + 'call-fullscreen.webp', t0: 21.45, t1: 25.2, same: true, grow: SHARE_TILE,
    cap: 'Full screen, <em>in a click.</em>', sub: 'You pick the bitrate and frame rate. Nobody asks you to pay for 1080p.',
    cam: [[21.45, 1, 960, 565], [25.2, 1.05, 960, 565]] },
  { shot: 'call-camera', img: VIDEO_SHOTS + 'call-camera.webp', t0: 25.0, t1: 29.6, same: true,
    cap: 'Cameras too, <em>side by side.</em>', sub: 'When several people share, watch them side by side.',
    cam: [[25, 1, 960, 565], [26.4, 1, 960, 565], [27.6, 1.25, 1250, 650]] },
  { shot: 'call-dj', t0: 29.4, t1: 35.6,
    cap: 'Take <em>the decks.</em>', sub: 'Everyone hears the same song at the same moment, late joiners included.',
    cam: [[29.4, 1, 960, 565], [34.6, 1.06, 900, 565]] },
  { shot: 'call-soundboard', t0: 35.4, t1: 41.4,
    cap: 'A soundboard <em>in every call.</em>', sub: 'Six classics under the rooster, and your house\'s own sounds.',
    cam: [[35.4, 1.0, 960, 565], [36.4, 1.18, 900, 700]],
    cursor: [[36.1, 760, 980], [37.1, 420, 800], [38.7, 420, 800], [39.2, 420, 742]],
    press: [[37.4, 325, 771, 194, 50, '🐓'], [39.3, 325, 712, 194, 50, '🔨']] },
  { shot: 'laptop', t0: 41.2, t1: 47.6,
    cap: 'Text channels <em>for between rounds.</em>', sub: 'Replies, reactions, polls, GIFs, custom emoji and stickers.',
    cam: [[41.2, 1.25, 900, 420], [42.8, 1.25, 900, 420], [45.8, 1.25, 900, 760]] },
];
const REELS = [
  { phone: 'phone-call', t0: 2.6, t1: 6.8,
    cap: 'Voice rooms <em>that stay open.</em>', sub: 'Drop in, drop out.' },
  { shot: 'ns', img: VIDEO_SHOTS + 'ns-off-00.webp', t0: 6.6, t1: 13.0,
    cap: 'Noise suppression, <em>one click away.</em>', sub: 'Sound on: before, then after.',
    cam: [[6.6, 1, 600, 800], [7.4, 1.15, 420, 860]],
    cursor: [[8.6, 700, 980], [9.5, 176, 1044]], press: [[9.9, ...NS_SWITCH]] },
  { shot: 'call-share', t0: 12.8, t1: 16.6,
    cap: 'Share your screen, <em>with its sound.</em>', sub: 'Stream a game for everyone.',
    cam: [[12.8, 1, 1240, 700], [14.0, 1.3, 1438, 820]] },
  { shot: 'call-camera', img: VIDEO_SHOTS + 'call-camera.webp', t0: 16.4, t1: 20.2,
    cap: 'Cameras too, <em>side by side.</em>', sub: 'Watch everyone who shares at once.',
    cam: [[16.4, 1, 1300, 640], [17.6, 1.2, 1437, 640]] },
  { shot: 'call-dj', t0: 20.0, t1: 24.6,
    cap: 'Take <em>the decks.</em>', sub: 'Everyone hears the same song, in sync.',
    cam: [[20, 1, 780, 600], [22, 1, 780, 600], [23, 1.15, 1300, 520]] },
  { shot: 'call-soundboard', t0: 24.4, t1: 29.4,
    cap: 'A soundboard <em>in every call.</em>', sub: 'Six classics, and your own.',
    cam: [[24.4, 1, 1100, 700], [25.2, 1.12, 900, 750]],
    cursor: [[24.9, 760, 980], [25.7, 420, 800], [27.0, 420, 800], [27.5, 420, 742]],
    press: [[26.0, 325, 771, 194, 50, '🐓'], [27.6, 325, 712, 194, 50, '🔨']] },
  { phone: 'phone-chat', t0: 29.2, t1: 33.6,
    cap: 'Text channels <em>for between rounds.</em>', sub: 'Replies, reactions, polls and GIFs.' },
];
const SCENES = REEL ? REELS : DESKTOP;
const NET_T = [47.4, 52.9];
const OUTRO_T = REEL ? 33.5 : 52.8;
window.DURATION = REEL ? 38 : 59;

// ------------------------------------------------------------- build
document.body.className = REEL ? 'reel' : '';
set(document.body, { width: `${W}px`, height: `${H}px` });
set($('stage'), { width: `${W}px`, height: `${H}px` });
set($('deco1'), { width: '900px', height: '900px', left: '-300px', top: '-360px' });
set($('deco2'), { width: '700px', height: '700px', right: '-260px', bottom: '-300px' });
'Rooster'.split('').forEach(ch => { const s = document.createElement('span'); s.textContent = ch; $('intro-word').appendChild(s); });

const CURSOR = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M5 3l14 8-6 1.6L10 19z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>';

// A phone with a capture on its screen; returns the layer the capture is on.
function phone(parent, name, h) {
  const ph = el('div', 'phone', parent, `<div class="screen"><div class="shot"><img src="${SHOTS}${name}-804.webp" width="804" height="1624"></div></div><img src="../../../website/media/devices/phone.svg">`);
  set(ph, { height: `${h}px` });
  const sw = h * 1318 / 2717 * .915023;
  const L = ph.querySelector('.shot');
  set(L, { transform: `scale(${sw / 804})` });
  return { ph, L, src: `${SHOTS}${name}-804.webp` };
}

SCENES.forEach(s => {
  s.root = el('div', '', $('scenes'));
  set(s.root, { position: 'absolute', inset: 0 });
  s.capEl = el('div', 'caption', $('stage'), `${s.cap}<span class="sub">${s.sub}</span>`);
  if (s.phone) {
    const { ph, L, src } = phone(s.root, s.phone, 1000);
    s.ph = ph;
    set(ph, { left: `${(W - 1000 * 1318 / 2717) / 2}px`, top: '590px' });
    s.fx = FX[s.phone](s, L, src);
    return;
  }
  s.frame = el('div', 'frame', s.root);
  box(s.frame, FRAME.x, FRAME.y, FRAME.w, FRAME.h);
  const src = s.img ?? `${SHOTS}${s.shot}-1920.webp`;
  s.layer = el('div', 'layer', s.frame, `<img src="${src}" width="1920" height="1131">`);
  s.base = Math.max(FRAME.w / 1920, FRAME.h / 1131);
  s.fx = FX[s.shot] ? FX[s.shot](s, s.layer, src) : null;
  if (s.spot) { s.spotEl = el('div', 'spot', s.layer); const [, , x, y, w, h] = s.spot; box(s.spotEl, x - 8, y - 8, w + 16, h + 16); }
  if (s.cursor) { s.ring = el('div', 'ring', s.layer); s.cur = el('div', 'cursor', s.layer, CURSOR); }
});

const netCap = el('div', 'caption', $('stage'), 'Your server. <em>Your rules.</em><span class="sub">Built on Matrix. Sign in with any account, or run a house of your own.</span>');

// The federation picture.
const NODES = [[960, 600], [470, 430], [1450, 430], [560, 810], [1360, 810]];
const LINKS = [[0, 1], [0, 2], [0, 3], [0, 4], [1, 2], [3, 1], [4, 2]];
document.querySelectorAll('.node').forEach((n, i) => set(n, { left: `${NODES[i][0]}px`, top: `${NODES[i][1]}px` }));
LINKS.forEach(([a, b]) => {
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', NODES[a][0]); l.setAttribute('y1', NODES[a][1]);
  l.setAttribute('x2', NODES[b][0]); l.setAttribute('y2', NODES[b][1]);
  l.setAttribute('stroke', '#362C27'); l.setAttribute('stroke-width', '6'); l.setAttribute('stroke-linecap', 'round');
  const len = Math.hypot(NODES[b][0] - NODES[a][0], NODES[b][1] - NODES[a][1]);
  l.setAttribute('stroke-dasharray', len); l.dataset.len = len;
  $('links').appendChild(l);
});
const PKTS = [];
for (let i = 0; i < 10; i++) PKTS.push(el('div', 'pkt', $('pkts')));

// A caption: slides up in, and its coloured words land on a beat.
function caption(e, t, k, t0) {
  set(e, { display: k > .001 ? 'block' : 'none', opacity: k, transform: `translateY(${(1 - k) * 26}px)` });
  if (k <= .001) return;
  const em = e.querySelector('em'), b = p(t, t0 + .35, .45, E.back);
  if (em) set(em, { transform: `scale(${.7 + .3 * b})`, opacity: clamp(b * 2) });
}

// ------------------------------------------------------------- seek
function seek(t) {
  const waits = [];
  set($('deco1'), { transform: `translate(${Math.sin(t * .2) * 40}px, ${Math.cos(t * .17) * 30}px)` });
  set($('deco2'), { transform: `translate(${Math.cos(t * .15) * 40}px, ${Math.sin(t * .22) * 30}px)` });
  STREAMS.forEach(f => { try { f.contentWindow.seek(t + 3); } catch (e) { /* not loaded yet, or a browser that keeps file pages apart */ } });

  // ---- intro
  const introEnd = REEL ? 2.6 : 4.0;
  const introOut = p(t, introEnd - .45, .45, E.in);
  set($('intro'), { opacity: 1 - introOut, transform: `scale(${1 + introOut * .12})`, display: t < introEnd + .05 ? 'flex' : 'none' });
  const sp = REEL ? .6 : 1; // the reel's intro runs faster
  const mk = p(t, .25 * sp, .7 * sp, E.back);
  set($('intro-mark'), { transform: `scale(${mk}) rotate(${(1 - p(t, .25 * sp, .9 * sp)) * -14}deg)`, opacity: clamp(mk * 2) });
  [...$('intro-word').children].forEach((s, i) => {
    const k = p(t, (.95 + i * .06) * sp, .45 * sp, E.back);
    set(s, { transform: `translateY(${(1 - k) * 60}px)`, opacity: clamp(k * 1.5) });
  });
  [...$('intro-tag').children].forEach((s, i) => {
    const k = p(t, REEL ? 1.0 + i * .3 : 2 + i * BEAT, .35, E.back);
    set(s, { transform: `scale(${.6 + .4 * k})`, opacity: clamp(k * 1.5) });
  });

  // ---- scenes: each slides in from the right and out to the left
  SCENES.forEach((s, i) => {
    const kin = p(t, s.t0, .5), kout = p(t, s.t1 - .45, .45, E.in);
    const on = kin > .001 && kout < .999;
    const next = SCENES[i + 1];
    const slideIn = s.same ? 0 : (1 - kin) * 160, slideOut = next && next.same ? 0 : kout * 160;
    set(s.root, { display: on ? 'block' : 'none', opacity: (s.same ? kin : Math.min(kin * 1.4, 1)) * (next && next.same ? 1 : 1 - kout), transform: `translateX(${slideIn - slideOut}px)` });
    // Where one screen turns into the next in place, its caption hands over
    // without the two overlapping.
    const capIn = s.t0 + (s.same ? .35 : .1), capOut = next && next.same ? next.t0 + .1 : s.t1;
    caption(s.capEl, t, win(t, capIn, capOut, s.same || (next && next.same) ? .25 : .4), capIn - .1);
    if (!on) return;
    const u = t - s.t0;
    if (s.fx) waits.push(s.fx(t, u));
    if (s.ph) {
      const r = p(t, s.t0, .9, E.out);
      set(s.ph, { transform: `translateY(${(1 - r) * 120 - u * 6}px) scale(${.96 + .04 * r})` });
      return;
    }
    // the camera: zoom about the focus, held inside the shot
    const [zoom, fx, fy] = track(s.cam, t);
    let sc = s.base * zoom;
    let tx = clamp(FRAME.w / 2 - fx * sc, FRAME.w - 1920 * sc, 0);
    let ty = clamp(FRAME.h / 2 - fy * sc, FRAME.h - 1131 * sc, 0);
    // Full screen grows out of the tile it was in, where the scene before
    // left it (at zoom 1).
    if (s.grow) {
      const g = E.io(clamp(u / .7)), [gx, gy, gw, gh] = s.grow, b = s.base;
      const from = [FRAME.x + gx * b, FRAME.y + gy * b, gw * b, gh * b], to = [FRAME.x, FRAME.y, FRAME.w, FRAME.h];
      const [x, y, w, h] = from.map((v, j) => lerp(v, to[j], g));
      box(s.frame, x, y, w, h);
      set(s.frame, { borderRadius: `${lerp(6, 20, g)}px` });
      // the video (y 26 to 1106 of the capture) fills the box as it grows
      const vs = lerp(w / 1920, sc, g);
      sc = vs; tx = lerp(0, tx, g); ty = lerp(-26 * vs, ty, g);
    }
    set(s.layer, { transform: `translate(${tx}px, ${ty}px) scale(${sc})` });
    if (s.spotEl) set(s.spotEl, { opacity: win(t, s.spot[0], s.spot[1], .5), borderWidth: `${4 / sc}px` });
    if (s.cursor) {
      const [cx, cy] = track(s.cursor, t);
      set(s.cur, { left: `${cx}px`, top: `${cy}px`, opacity: win(t, s.cursor[0][0], s.t1, .25), transform: `scale(${1 / sc})` });
      let ck = 0;
      s.press.forEach(([tp]) => { if (t >= tp && t < tp + .45) ck = (t - tp) / .45; });
      const r = 35 / sc;
      set(s.ring, { left: `${cx - r}px`, top: `${cy - r}px`, width: `${2 * r}px`, height: `${2 * r}px`, borderWidth: `${4 / sc}px`, opacity: ck ? 1 - ck : 0, transform: `scale(${.3 + ck})` });
    }
  });

  // ---- your server (desktop)
  const nk = REEL ? 0 : win(t, NET_T[0], NET_T[1], .45);
  set($('net'), { display: nk > .001 ? 'block' : 'none', opacity: nk });
  caption(netCap, t, nk, NET_T[0]);
  if (nk > .001) {
    const n0 = NET_T[0];
    document.querySelectorAll('.node').forEach((n, i) => {
      const k = p(t, i === 0 ? n0 + .1 : n0 + .6 + i * .18, .5, E.back);
      set(n, { transform: `scale(${k})`, opacity: clamp(k * 1.5) });
    });
    [...$('links').children].forEach((l, i) => l.setAttribute('stroke-dashoffset', l.dataset.len * (1 - p(t, n0 + 1 + i * .08, .6))));
    PKTS.forEach((d, i) => {
      const [a, b] = LINKS[i % LINKS.length];
      const start = n0 + 1.6 + i * .23, k = ((t - start) / 1.1) % 1, fw = i % 2 === 0;
      const [ax, ay] = NODES[fw ? a : b], [bx, by] = NODES[fw ? b : a];
      set(d, { left: `${lerp(ax, bx, k)}px`, top: `${lerp(ay, by, k)}px`, opacity: t > start ? Math.sin(Math.PI * k) : 0 });
    });
    const lk = p(t, n0 + 2.1, .5, E.back);
    set($('lock'), { opacity: clamp(lk * 1.5), transform: `translateX(-50%) scale(${lk})` });
  }

  // ---- outro
  const o = OUTRO_T;
  set($('outro'), { display: t > o - .1 ? 'flex' : 'none' });
  const om = p(t, o, .7, E.back);
  set($('outro-mark'), { transform: `scale(${om}) rotate(${(1 - om) * -20}deg)` });
  const ow = p(t, o + .4, .6);
  set($('outro-word'), { opacity: ow, transform: `translate${REEL ? 'Y' : 'X'}(${(1 - ow) * 40}px)` });
  const ot = p(t, o + .8, .6);
  set($('outro-tag'), { opacity: ot, transform: `translate${REEL ? 'Y' : 'X'}(${(1 - ot) * 40}px)` });
  [...$('chips').children].forEach((c, i) => {
    const k = p(t, o + 1.3 + i * .12, .45, E.back);
    set(c, { opacity: clamp(k * 1.5), transform: `translateY(${(1 - k) * 24}px)` });
  });
  set($('free'), { opacity: p(t, o + 1.9, .5) });
  set($('url'), { opacity: p(t, o + 2.1, .5) });

  set($('fade'), { opacity: p(t, window.DURATION - .7, .7, E.io) });
  const pending = waits.filter(Boolean);
  return pending.length ? Promise.all(pending) : null;
}

// Frame pump for real-time preview; render_demo.py drives seek() itself.
if (!navigator.webdriver && !location.hash.includes('render')) {
  const t0 = performance.now();
  const tick = () => { seek(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(tick); };
  document.fonts.ready.then(tick);
} else {
  seek(0);
}
</script>
</body>
