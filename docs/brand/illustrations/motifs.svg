<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <!-- The comb and the lit window as small recurring UI motifs. -->
  <rect width="960" height="300" rx="24" fill="#2A221E"/>
  <g font-family="Nunito Sans, sans-serif" font-size="15" font-weight="700" fill="#9C8F85" text-anchor="middle">
    <text x="100" y="262">knock / mention</text>
    <text x="290" y="262">speaking</text>
    <text x="480" y="262">loading</text>
    <text x="670" y="262">room with people</text>
    <text x="860" y="262">empty room</text>
  </g>

  <!-- knock: the comb as a notification badge -->
  <g transform="translate(100 140)">
    <circle r="34" fill="#3F342E"/>
    <g fill="#E0442F" transform="translate(22 -24)">
      <circle cx="-9" cy="3" r="8"/>
      <circle cx="0" cy="-3" r="9.5"/>
      <circle cx="9" cy="3" r="8"/>
      <rect x="-15" y="2" width="30" height="10" rx="5"/>
    </g>
  </g>

  <!-- speaking: three comb lobes as a level meter -->
  <g transform="translate(290 150)" fill="#6E9A5B">
    <rect x="-34" y="-22" width="18" height="40" rx="9"/>
    <rect x="-9" y="-44" width="18" height="62" rx="9"/>
    <rect x="16" y="-30" width="18" height="48" rx="9"/>
  </g>

  <!-- loading: the lobes take turns -->
  <g transform="translate(480 140)" fill="#D4643C">
    <circle cx="-30" cy="6" r="13" opacity=".55"/>
    <circle cx="0" cy="-8" r="16"/>
    <circle cx="30" cy="6" r="13" opacity=".55"/>
  </g>

  <!-- occupied room: lights on -->
  <g transform="translate(670 146)">
    <path d="M-40 -6 L0 -40 L40 -6" fill="none" stroke="#F5EBDD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-30" y="-8" width="60" height="50" rx="6" fill="#F5EBDD"/>
    <rect x="-14" y="4" width="28" height="24" rx="4" fill="#F2A33A"/>
  </g>

  <!-- empty room: lights off -->
  <g transform="translate(860 146)">
    <path d="M-40 -6 L0 -40 L40 -6" fill="none" stroke="#6F625A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-30" y="-8" width="60" height="50" rx="6" fill="#6F625A"/>
    <rect x="-14" y="4" width="28" height="24" rx="4" fill="#2A221E"/>
  </g>
</svg>
