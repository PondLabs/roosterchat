<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 2 AM. Someone is still up. -->
  <rect width="800" height="600" fill="#231A16"/>

  <g fill="#F5EBDD">
    <circle cx="86" cy="74" r="2.5" opacity=".7"/>
    <circle cx="172" cy="148" r="1.8" opacity=".5"/>
    <circle cx="238" cy="58" r="2.2" opacity=".6"/>
    <circle cx="330" cy="112" r="1.6" opacity=".45"/>
    <circle cx="548" cy="52" r="2" opacity=".6"/>
    <circle cx="742" cy="196" r="2.4" opacity=".55"/>
    <circle cx="112" cy="252" r="1.7" opacity=".4"/>
    <circle cx="700" cy="300" r="1.6" opacity=".4"/>
    <path d="M598 186 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity=".75"/>
    <path d="M60 172 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".55"/>
  </g>
  <!-- moon -->
  <path d="M676 72 a46 46 0 1 0 38 72 a40 40 0 1 1 -38 -72z" fill="#F2A33A" opacity=".9"/>

  <!-- ground -->
  <path d="M0 548 C 160 538 300 552 420 546 S 680 536 800 546 V600 H0z" fill="#2E2420"/>

  <!-- chimney -->
  <path d="M492 262 h32 v70 h-32z" fill="#8A3A22"/>
  <path d="M488 256 h40 v12 h-40z" fill="#6E2C19"/>

  <!-- house -->
  <path d="M262 354 L540 354 L542 548 L258 550 Z" fill="#D4643C"/>
  <path d="M214 374 C 216 368 222 362 228 358 L392 238 C 398 233 404 233 410 238 L574 356 C 581 361 586 368 586 374 Z" fill="#8A3A22"/>
  <path d="M262 380 L540 380" stroke="#B4512D" stroke-width="6" stroke-linecap="round"/>

  <!-- lit window (the computer's in there) -->
  <rect x="292" y="414" width="68" height="62" rx="6" fill="#F2A33A"/>
  <path d="M326 416 V474 M294 445 H358" stroke="#D4643C" stroke-width="6"/>
  <!-- dark window -->
  <rect x="446" y="414" width="68" height="62" rx="6" fill="#3A2E28"/>
  <path d="M480 416 V474 M448 445 H512" stroke="#D4643C" stroke-width="6"/>
  <!-- door, left ajar -->
  <path d="M378 548 V498 a24 24 0 0 1 48 0 V548z" fill="#3A2E28"/>
  <path d="M420 548 V500 a18 22 0 0 0 -6 -16 V548z" fill="#F2A33A" opacity=".85"/>
  <circle cx="390" cy="522" r="3.5" fill="#F2A33A"/>
  <!-- light spilling on the ground -->
  <path d="M404 549 L470 600 H382 L386 549z" fill="#F2A33A" opacity=".22"/>

  <!-- the rooster -->
  <g>
    <!-- tail, a bit ragged -->
    <g fill="none" stroke-linecap="round">
      <path d="M362 212 C 330 206 318 176 326 146" stroke="#D4643C" stroke-width="17"/>
      <path d="M358 222 C 316 222 296 192 298 160" stroke="#6E9A5B" stroke-width="16"/>
      <path d="M360 232 C 312 240 284 216 276 186" stroke="#5E86B0" stroke-width="14"/>
      <path d="M362 238 C 330 252 300 248 286 232" stroke="#D4643C" stroke-width="10"/>
    </g>
    <!-- feet on the ridge -->
    <g stroke="#F2A33A" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M384 232 L382 246 M382 246 l-9 4 M382 246 l2 7 M382 246 l8 3"/>
      <path d="M410 232 L412 246 M412 246 l-8 4 M412 246 l3 7 M412 246 l9 2"/>
    </g>
    <!-- body and neck -->
    <ellipse cx="394" cy="206" rx="46" ry="36" fill="#F5EBDD"/>
    <path d="M404 186 C 404 160 414 146 432 146 C 452 146 458 166 452 186 C 446 204 424 214 410 210 Z" fill="#F5EBDD"/>
    <!-- wing -->
    <path d="M364 202 C 372 184 404 184 414 202 C 404 222 380 226 366 216 Z" fill="#EADCC8"/>
    <path d="M374 210 q10 6 22 2 M378 202 q10 4 20 1" stroke="#CDB99E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="436" cy="146" r="28" fill="#F5EBDD"/>
    <!-- comb -->
    <g fill="#E0442F">
      <circle cx="421" cy="118" r="11"/>
      <circle cx="435" cy="111" r="13.5"/>
      <circle cx="451" cy="117" r="11"/>
      <circle cx="459" cy="128" r="7"/>
    </g>
    <!-- beak and wattle -->
    <path d="M460 142 L488 152 C 490 153 490 155 488 156 L460 162 Z" fill="#F2A33A"/>
    <path d="M462 154 L478 156" stroke="#C47F22" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="460" cy="172" rx="7" ry="11" fill="#E0442F"/>
    <!-- eye: very tired, still online -->
    <circle cx="446" cy="140" r="6.5" fill="#231A16"/>
    <path d="M438 139 C 440 131 452 131 454 139 Z" fill="#F5EBDD"/>
    <path d="M438 139 L454 139" stroke="#231A16" stroke-width="2.5" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M420 150 C 410 112 452 94 466 124" stroke="#8C7F76" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="424" cy="154" rx="11" ry="14" fill="#5E86B0"/>
    <ellipse cx="421" cy="154" rx="5" ry="8" fill="#48698C"/>
    <!-- the cable goes all the way down to the computer -->
    <path d="M420 168 C 416 214 352 232 330 276 C 312 312 348 348 334 384 C 328 398 330 408 334 416" stroke="#3A2E28" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
